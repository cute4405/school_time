<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세명컴퓨터고등학교 시간표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#e9edf3; --paper:#f8f9fb; --ink:#161d33; --sub:#667089; --line:#d3d9e4;
  --blue:#2446d8; --blue-ink:#fff; --today:#fff3c4; --today-line:#e8b800;
  --sl:90%; --ss:62%; --tl:24%; --ts:50%;
  --font:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1220; --paper:#171b2e; --ink:#eceff8; --sub:#8e98b4; --line:#2a3050;
  --blue:#7b95ff; --blue-ink:#0f1220; --today:#2b2812; --today-line:#d9b32a;
  --sl:24%; --ss:40%; --tl:86%; --ts:60%;
}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;line-height:1.5;background:radial-gradient(ellipse at top, color-mix(in srgb,var(--blue) 7%,var(--bg)),var(--bg) 58%)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:26px 16px 44px}

/* 상단 */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{margin:0;font-size:27px;font-weight:850;letter-spacing:-.04em;line-height:1.18}
.top h1 small{display:block;font-size:13px;font-weight:500;color:var(--sub);letter-spacing:0;margin-bottom:6px}
#chg{background:none;border:0;color:var(--sub);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}

/* 조작줄 */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.sel{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:8px 14px;font-weight:600;cursor:pointer}
.sel select+select{border-left:1.5px solid var(--ink)}
.wk{margin-left:auto;display:flex;align-items:center;gap:4px}
.wk button{border:0;background:transparent;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px}
.wk button:hover{background:var(--line)}
#today{width:auto;padding:0 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px}
#today:hover{background:var(--ink);opacity:.85}
#range{font-weight:700;font-size:16px;letter-spacing:-.02em;margin:0 0 10px}

/* 시간표 */
#out{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 26px #0000000a}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:0;text-align:center}
thead th{height:58px;font-weight:750;font-size:14px;border-bottom:1px solid var(--line);vertical-align:middle;background:color-mix(in srgb,var(--line) 12%,var(--paper))}
thead th span{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-top:2px}
thead th.t{background:var(--today);box-shadow:inset 0 -3px 0 var(--today-line)}
th.n,td.n{width:38px;color:var(--sub);font-size:13px;font-weight:600;border-right:1px solid var(--line)}
td{height:64px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;vertical-align:stretch}
td.n{border-left:0}
td.t{background:color-mix(in srgb,var(--today) 55%,transparent)}
tbody tr:first-child td{border-top:0}
.s{display:flex;align-items:center;justify-content:center;height:100%;padding:0 4px;border-radius:7px;
  font-size:13.5px;font-weight:600;line-height:1.25;word-break:keep-all;letter-spacing:-.02em;
  background:hsl(var(--h) var(--ss) var(--sl));color:hsl(var(--h) var(--ts) var(--tl))}
.e{display:block;height:100%;border-radius:7px;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 55%,transparent) 6px 7px)}
#msg{text-align:center;color:var(--sub);padding:40px 16px;line-height:1.6}
.err{color:#d33}

/* 학교 검색 (학교 고정 안 할 때) */
#setup{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 8px 26px #0000000a}
#setup h2{margin:0 0 12px;font-size:20px;letter-spacing:-.02em}
.row{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--ink);border-radius:10px;background:transparent}
#find{padding:0 18px;border:0;border-radius:10px;background:var(--blue);color:var(--blue-ink);font-weight:700;cursor:pointer}
#list button{display:block;width:100%;text-align:left;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer}
#list button:hover{border-color:var(--ink)}
#list small{color:var(--sub)}
.hint{color:var(--sub);font-size:12.5px;margin-top:10px;line-height:1.5}

@media (max-width:480px){
  .wrap{padding:16px 8px 32px}
  .top h1{font-size:22px}
  .wk{margin-left:0;width:100%;justify-content:space-between}
  td{height:60px;padding:2px}
  .s{font-size:12.5px;padding:0 2px}
  th.n,td.n{width:28px}
}
@media (prefers-reduced-motion:no-preference){
  #out table{animation:in .35s ease-out}
  @keyframes in{from{opacity:0}to{opacity:1}}
}

/* 현재 교시 표시 */
#currentPeriod{background:linear-gradient(135deg,color-mix(in srgb,var(--blue) 7%,var(--paper)),var(--paper) 70%);border:1px solid color-mix(in srgb,var(--blue) 50%,var(--line));border-radius:16px;padding:17px 18px;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 6px 22px #00000008}
#currentPeriod>div:first-child{flex:1;min-width:0}
#currentPeriod .cp-label{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:6px}
#currentPeriod .cp-main{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.35;overflow-wrap:anywhere}
#currentPeriod .cp-sub{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.6;overflow-wrap:anywhere}
#currentPeriod .cp-time{font-size:13px;font-weight:700;text-align:right;white-space:nowrap;line-height:1.5;padding-left:14px;border-left:1px solid var(--line);flex-shrink:0}
@media(max-width:480px){#currentPeriod{padding:12px;gap:12px}.cp-main{font-size:18px!important}#currentPeriod .cp-sub{margin-top:7px;font-size:12.5px}#currentPeriod .cp-time{padding-left:10px;font-size:12px}}

/* 시간표 안내 및 알람 */
#dailySchedule{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 18px;box-shadow:0 6px 22px #00000007}
#dailySchedule h2{font-size:16px;font-weight:800;letter-spacing:-.02em;margin:0 0 12px}
#scheduleDetails{margin-top:2px}
#scheduleDetails summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:13px;font-weight:750;background:color-mix(in srgb,var(--line) 15%,var(--paper));user-select:none;transition:background .18s,border-color .18s}
#scheduleDetails summary::-webkit-details-marker{display:none}
#scheduleDetails summary:hover{border-color:color-mix(in srgb,var(--blue) 55%,var(--line));background:color-mix(in srgb,var(--blue) 7%,var(--paper))}
#scheduleDetails summary::after{content:"＋";font-size:16px;color:var(--sub);flex-shrink:0}
#scheduleDetails[open] summary{margin-bottom:9px}
#scheduleDetails[open] summary::after{content:"−"}
.schedule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.schedule-item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;padding:10px 12px;background:color-mix(in srgb,var(--line) 23%,var(--paper));border:1px solid color-mix(in srgb,var(--line) 65%,transparent);border-radius:10px;font-size:13px;line-height:1.4}
.schedule-item strong{white-space:nowrap;font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums}
.schedule-item.lunch-item{justify-content:flex-start;gap:16px;background:color-mix(in srgb,var(--blue) 7%,var(--paper));border-color:color-mix(in srgb,var(--blue) 20%,var(--line))}
.schedule-item.lunch-item span{font-weight:750;color:var(--blue)}
.schedule-item.lunch-item strong{margin-left:0}
.schedule-item.lunch-item{grid-column:1 / -1}
#alarmToggle{margin-top:14px;border:0;border-radius:999px;background:var(--blue);color:var(--blue-ink);padding:11px 16px;font-weight:750;cursor:pointer;box-shadow:0 4px 12px color-mix(in srgb,var(--blue) 22%,transparent);transition:transform .15s,opacity .15s}
#alarmToggle:hover{opacity:.92;transform:translateY(-1px)}
button,select,input{transition:border-color .15s,background-color .15s}
#alarmNote{font-size:12px;color:var(--sub);margin:8px 0 0;line-height:1.5}
#alarmToast{display:none;position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:12px;box-shadow:0 8px 30px #0003;max-width:calc(100% - 28px);font-weight:700;text-align:center}
@media(max-width:480px){.wrap{padding:16px 9px 30px}.schedule-grid{grid-template-columns:1fr}.schedule-item{font-size:13px;padding:10px 12px}.schedule-item.lunch-item{gap:12px}#dailySchedule{padding:13px;border-radius:14px}#currentPeriod{border-radius:14px}.top{align-items:center;margin-bottom:15px}}


/* ── 시각 디자인: 차분한 교내 플래너 스타일 ── */
:root{
  --bg:#f3f2ed;--paper:#fffefa;--ink:#202d2a;--sub:#727d76;--line:#dfe3da;
  --blue:#236b56;--blue-ink:#fffefa;--today:#e9f2e8;--today-line:#236b56;
  --font:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media(prefers-color-scheme:dark){:root{--bg:#151b19;--paper:#1d2622;--ink:#e9eee9;--sub:#a2afa6;--line:#35423b;--blue:#8fc6a9;--blue-ink:#14211a;--today:#253c30;--today-line:#8fc6a9}}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);letter-spacing:-.018em}
.wrap{max-width:820px;padding:30px 22px 54px}
.top{align-items:center;margin-bottom:24px;padding:0 2px}
.top h1{font-size:30px;letter-spacing:-.055em;font-weight:800}
.top h1 small{font-size:12px;letter-spacing:.04em;text-transform:none;font-weight:700;color:var(--blue);margin-bottom:8px}
#chg{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:8px 11px;color:var(--sub);background:var(--paper)}

.ctl{margin:0 0 14px;gap:10px}
.sel{border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.sel select{padding:9px 13px;font-size:13px;font-weight:700}
.sel select+select{border-left:1px solid var(--line)}
.wk{gap:5px}
.wk button{width:34px;height:34px;border:1px solid var(--line);background:var(--paper);font-size:13px}
.wk button:hover{background:var(--today)}
#today{background:var(--ink);color:var(--paper);font-size:12px;padding:0 13px}
#range{font-size:14px;font-weight:750;letter-spacing:0;margin:0 0 9px;color:var(--sub)}
#out{background:var(--paper);border:1px solid var(--line);border-radius:11px;box-shadow:none;overflow:hidden}
thead th{height:54px;background:#f6f6f0;border-bottom:1px solid var(--line);font-size:13px}
@media(prefers-color-scheme:dark){thead th{background:#222d27}}
thead th span{font-size:11px;margin-top:3px}
th.n,td.n{width:42px;font-size:12px;background:color-mix(in srgb,var(--line) 20%,var(--paper))}
td{height:68px;border-color:var(--line);padding:5px}
td.t{background:color-mix(in srgb,var(--today) 60%,var(--paper))}
thead th.t{background:var(--today);box-shadow:inset 0 -2px 0 var(--today-line)}
.s{border-radius:5px;font-size:13px;font-weight:650;letter-spacing:-.025em;padding:2px 5px}
.e{border-radius:4px;background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--line) 55%,transparent) 7px 8px)}
#setup{border-radius:11px;box-shadow:none;padding:22px;border-color:var(--line)}
#setup h2{font-size:19px;font-weight:800}
#q{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:11px 12px}
#find{border-radius:7px;background:var(--blue);padding:0 17px}
#list button{border-radius:7px;border-color:var(--line);padding:11px 12px}
#currentPeriod{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:18px 19px;margin-bottom:13px;box-shadow:none;gap:20px}
#currentPeriod .cp-label{font-size:11px;letter-spacing:.045em;text-transform:uppercase;margin-bottom:7px}
#currentPeriod .cp-main{font-size:23px;letter-spacing:-.04em;font-weight:800}
#currentPeriod .cp-sub{font-size:13px;margin-top:6px}

.schedule-item.lunch-item{background:var(--today);border-color:color-mix(in srgb,var(--blue) 30%,var(--line));gap:10px}
.schedule-item.lunch-item span{color:var(--blue)}

@media(max-width:560px){
 .wrap{padding:20px 10px 34px}
 .top{margin-bottom:18px;align-items:flex-start}
 .top h1{font-size:24px}
 #chg{font-size:12px;padding:7px 9px}
 #currentPeriod{padding:14px 12px;gap:11px;border-radius:8px}
 #currentPeriod .cp-main{font-size:19px}
 #currentPeriod .cp-time{padding-left:10px;font-size:11px}

 .schedule-item.lunch-item{gap:10px}
 td{height:59px;padding:2px}
 th.n,td.n{width:29px}

}
@media(max-width:370px){.schedule-grid{grid-template-columns:1fr}.top h1{font-size:22px}#currentPeriod .cp-main{font-size:17px}}

</style>

<body>
<div class="wrap">
  <div id="setup" hidden>
    <h2>학교 시간표</h2>
    <div class="row"><input id="q" placeholder="학교 이름 (예: 서울고등학교)"><button id="find">검색</button></div>
    <div id="list"></div>
    <div class="hint">학교를 한 번 선택하면 다음부터는 열자마자 시간표가 나와요.</div>
  </div>

  <div id="view" hidden>
    <div class="top">
      <h1><small id="kindtxt">이번 주 시간표</small><span id="sname"></span></h1>
      <button id="chg">학교 변경</button>
    </div>
    <section id="currentPeriod" aria-live="polite">
      <div>
        <div class="cp-label">현재 시간 기준</div>
        <div id="cpMain" class="cp-main">시간 확인 중…</div>
        <div id="cpSub" class="cp-sub"></div>
      </div>
      <div id="cpTime" class="cp-time"></div>
    </section>
    <section id="dailySchedule" aria-label="전체 수업 시간표">
      <h2>수업 시간 및 알람</h2>
      <details id="scheduleDetails">
        <summary>전체 수업 시간표 확인하기</summary>
        <div class="schedule-grid" id="scheduleGrid"></div>
      </details>
      <button id="alarmToggle" type="button">🔔 수업 알람 켜기</button>
      <p id="alarmNote">알람을 켜면 수업 시작·종료, 쉬는 시간 시작·종료, 점심시간 시작·종료에 알림이 표시돼요. 브라우저 알림은 권한 허용이 필요해요.</p>
    </section>
    <div class="ctl">
      <div class="sel"><select id="grade" aria-label="학년"></select><select id="cls" aria-label="반"></select></div>
      <div class="wk">
        <button id="prev" aria-label="이전 주">◀</button>
        <button id="today">이번 주</button>
        <button id="next" aria-label="다음 주">▶</button>
      </div>
    </div>
    <p id="range"></p>
    <div id="out"><div id="msg"></div></div>
  </div>
</div>
<div id="alarmToast" role="status" aria-live="polite"></div>

<script>
// ▼▼ 만든 사람이 딱 한 번만 설정 (사용자는 키를 몰라도 됩니다) ▼▼
const CONFIG={
  KEY:"26518d3177604142bbecb3f98380355c",          // NEIS 인증키 (open.neis.go.kr 에서 무료 발급)
  SCHOOL:"세명컴퓨터고등학교", // 학교 고정 (비워 두면 사용자가 학교를 검색해 고름)
  GRADE:1,         // SCHOOL을 입력했을 때 기본 학년
  CLASS:1          // SCHOOL을 입력했을 때 기본 반
};
// ▲▲ ------------------------------------------------ ▲▲
const $=id=>document.getElementById(id);
const API="https://open.neis.go.kr/hub/";
const KIND={"초등학교":"els","중학교":"mis","고등학교":"his","특수학교":"sps"};
const DAYS=["월","화","수","목","금"];
const HUES=[218,168,28,340,265,92,196,8,48,300]; // 과목 색 (10가지)
let school=null, monday=getMonday(new Date());
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function getMonday(d){d=new Date(d);const w=d.getDay();d.setDate(d.getDate()+(w===0?-6:1-w));d.setHours(0,0,0,0);return d}
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=d=>`${d.getMonth()+1}월 ${d.getDate()}일`;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return HUES[h%HUES.length]};

async function call(ep,params){
  const key=CONFIG.KEY;
  if(!key) throw new Error("관리자 설정이 필요해요. 파일 맨 위 CONFIG의 KEY에 인증키를 넣어 주세요.");
  const u=new URL(API+ep);
  Object.entries({KEY:key,Type:"json",pIndex:1,pSize:1000,...params}).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u);
  const j=await r.json();
  if(j.RESULT){ if(j.RESULT.CODE==="INFO-200") return []; throw new Error(j.RESULT.MESSAGE); }
  const body=j[ep];
  return body[1].row;
}

try{school=JSON.parse(store.get("school")||"null")}catch(e){}
if(CONFIG.SCHOOL){
  $("setup").hidden=true; $("view").hidden=false;
  $("out").innerHTML='<div id="msg">불러오는 중…</div>';
  (async()=>{
    try{
      if(!school||school.name!==CONFIG.SCHOOL){
        const rows=(await call("schoolInfo",{SCHUL_NM:CONFIG.SCHOOL})).filter(r=>KIND[r.SCHUL_KND_SC_NM]);
        const r=rows.find(x=>x.SCHUL_NM===CONFIG.SCHOOL)||rows[0];
        if(!r) throw new Error("학교를 찾을 수 없어요. 설정의 학교 이름을 확인해 주세요.");
        school={name:r.SCHUL_NM,kind:KIND[r.SCHUL_KND_SC_NM],edu:r.ATPT_OFCDC_SC_CODE,code:r.SD_SCHUL_CODE};
        store.set("school",JSON.stringify(school));
      }
      openSchool();
      $("chg").hidden=true;
    }catch(e){$("out").innerHTML=`<div id="msg" class="err">${e.message}</div>`}
  })();
}else if(school) openSchool();
else $("setup").hidden=false;

$("find").onclick=async()=>{
  const l=$("list"); l.textContent="검색 중…";
  try{
    const rows=await call("schoolInfo",{SCHUL_NM:$("q").value.trim()});
    l.innerHTML="";
    if(!rows.length){l.textContent="검색 결과가 없어요. 학교 이름을 다시 확인해 주세요.";return}
    rows.filter(r=>KIND[r.SCHUL_KND_SC_NM]).forEach(r=>{
      const b=document.createElement("button");
      b.innerHTML=`${esc(r.SCHUL_NM)} <small>${esc(r.ORG_RDNMA||"")}</small>`;
      b.onclick=()=>{school={name:r.SCHUL_NM,kind:KIND[r.SCHUL_KND_SC_NM],edu:r.ATPT_OFCDC_SC_CODE,code:r.SD_SCHUL_CODE};store.set("school",JSON.stringify(school));openSchool()};
      l.appendChild(b);
    });
  }catch(e){l.innerHTML=`<span class="err">${e.message}</span>`}
};
$("q").onkeydown=e=>{if(e.key==="Enter")$("find").click()};

function openSchool(){
  $("setup").hidden=true; $("view").hidden=false;
  $("sname").textContent=school.name;
  const g=$("grade"), max=school.kind==="els"?6:3;
  g.innerHTML=""; for(let i=1;i<=max;i++)g.add(new Option(i+"학년",i));
  const c=$("cls"); c.innerHTML=""; for(let i=1;i<=20;i++)c.add(new Option(i+"반",i));
  g.value=CONFIG.SCHOOL?CONFIG.GRADE:(store.get("grade")||1); c.value=CONFIG.SCHOOL?CONFIG.CLASS:(store.get("cls")||1);
  load();
}
$("chg").onclick=()=>{$("view").hidden=true;$("setup").hidden=false};
$("grade").onchange=$("cls").onchange=()=>{store.set("grade",$("grade").value);store.set("cls",$("cls").value);load()};
$("prev").onclick=()=>{monday=addDays(monday,-7);load()};
$("next").onclick=()=>{monday=addDays(monday,7);load()};
$("today").onclick=()=>{monday=getMonday(new Date());load()};

async function load(){
  const fri=addDays(monday,4);
  $("range").textContent=`${fmt(monday)} – ${fmt(fri)}`;
  $("kindtxt").textContent=ymd(monday)===ymd(getMonday(new Date()))?"이번 주 시간표":"시간표";
  $("out").innerHTML='<div id="msg">불러오는 중…</div>';
  try{
    const rows=await call(school.kind+"Timetable",{
      ATPT_OFCDC_SC_CODE:school.edu,SD_SCHUL_CODE:school.code,
      TI_FROM_YMD:ymd(monday),TI_TO_YMD:ymd(fri),
      GRADE:$("grade").value,CLASS_NM:$("cls").value
    });
    render(rows);
  }catch(e){$("out").innerHTML=`<div id="msg" class="err">${e.message}</div>`}
}

// 수업 시간표: 모든 계산은 초 단위로 처리
const PERIODS = [
  {name:"1교시", start:8*60+20, end:9*60+10},
  {name:"2교시", start:9*60+20, end:10*60+10},
  {name:"3교시", start:10*60+20, end:11*60+10},
  {name:"4교시", start:11*60+20, end:12*60+10},
  {name:"5교시", start:13*60+10, end:14*60},
  {name:"6교시", start:14*60+10, end:15*60},
  {name:"7교시", start:15*60+10, end:16*60}
];
const fmtTime=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const formatLeft=seconds=>{
  seconds=Math.max(0,Math.floor(seconds));
  const m=Math.floor(seconds/60), sec=seconds%60;
  return `${m}분 ${String(sec).padStart(2,"0")}초`;
};
function renderDailySchedule(){
  const grid=$("scheduleGrid");
  if(!grid) return;
  const items=[
    ...PERIODS.map(p=>({label:p.name,time:`${fmtTime(p.start)} ~ ${fmtTime(p.end)}`})),
  ];
  // 쉬는 시간 및 점심시간을 시간 순서대로 함께 표시
  items.push(
    {label:"쉬는 시간",time:"09:10 ~ 09:20"},
    {label:"쉬는 시간",time:"10:10 ~ 10:20"},
    {label:"쉬는 시간",time:"11:10 ~ 11:20"},
    {label:"쉬는 시간",time:"12:10 ~ 12:20"},
    {label:"점심시간",time:"12:20 ~ 13:10"},
    {label:"쉬는 시간",time:"14:00 ~ 14:10"},
    {label:"쉬는 시간",time:"15:00 ~ 15:10"}
  );
  items.sort((a,b)=>a.time.slice(0,5).replace(":","")*1-b.time.slice(0,5).replace(":","")*1);
  grid.innerHTML=items.map(x=>`<div class="schedule-item${x.label==="점심시간"?" lunch-item":""}"><span>${x.label}</span><strong>${x.time}</strong></div>`).join("");
}
let alarmsEnabled=false, audioCtx=null, lastAlarmKey="", toastTimer=null;
const EVENTS=[];
PERIODS.forEach((p,i)=>{
  EVENTS.push({at:p.start,label:`${p.name} 수업 시작`},{at:p.end,label:`${p.name} 수업 종료`});
  if(i<PERIODS.length-1 && i!==3){
    EVENTS.push({at:p.end,label:"쉬는 시간 시작"},{at:PERIODS[i+1].start,label:"쉬는 시간 종료"});
  }
});
EVENTS.push({at:12*60+10,label:"점심시간 전 쉬는 시간 시작"},
  {at:12*60+20,label:"점심시간 시작"},{at:13*60+10,label:"점심시간 종료 · 5교시 시작"});
// 같은 시각에 수업 종료와 쉬는 시간 시작 등 여러 알림이 겹치므로 보기 좋은 하나의 알림으로 묶음
function eventsAt(minute){
  const found=EVENTS.filter(e=>e.at===minute).map(e=>e.label);
  if(minute===9*60+10 || minute===10*60+10 || minute===11*60+10 ||
     minute===14*60 || minute===15*60){
    return ["수업 종료 · 쉬는 시간 시작"];
  }
  if(minute===12*60+10) return ["4교시 종료 · 점심 전 쉬는 시간 시작"];
  if(minute===12*60+20) return ["점심시간 시작"];
  if(minute===13*60+10) return ["점심시간 종료 · 5교시 시작"];
  if(minute===9*60+20 || minute===10*60+20 || minute===11*60+20 ||
     minute===14*60+10 || minute===15*60+10){
    const p=PERIODS.find(x=>x.start===minute);
    return [p ? `${p.name} 수업 시작` : "수업 시작"];
  }
  return found;
}
function showAlarm(message){
  const toast=$("alarmToast");
  toast.textContent="🔔 "+message;
  toast.style.display="block";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{toast.style.display="none"},7000);
  if("Notification" in window && Notification.permission==="granted"){
    try{new Notification("학교 시간표 알림",{body:message})}catch(e){}
  }
  if(audioCtx && alarmsEnabled){
    try{
      const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.frequency.value=880;gain.gain.value=0.12;
      osc.start();osc.stop(audioCtx.currentTime+0.22);
    }catch(e){}
  }
}
$("alarmToggle").addEventListener("click",async()=>{
  alarmsEnabled=!alarmsEnabled;
  if(alarmsEnabled){
    try{
      const AudioContextClass=window.AudioContext||window.webkitAudioContext;
      if(AudioContextClass){audioCtx=audioCtx||new AudioContextClass();if(audioCtx.state==="suspended")await audioCtx.resume();}
    }catch(e){}
    if("Notification" in window && Notification.permission==="default"){
      try{await Notification.requestPermission()}catch(e){}
    }
    $("alarmToggle").textContent="🔕 수업 알람 끄기";
    $("alarmNote").textContent="알람이 켜져 있어요. 페이지가 열려 있는 동안 알림과 소리로 알려줘요. 브라우저 알림은 권한을 허용해야 표시돼요.";
    showAlarm("수업 알람을 켰어요.");
  }else{
    $("alarmToggle").textContent="🔔 수업 알람 켜기";
    $("alarmNote").textContent="알람이 꺼져 있어요. 버튼을 누르면 수업 시작·종료와 쉬는 시간 알림을 받을 수 있어요.";
    $("alarmToast").style.display="none";
  }
});
function updateCurrentPeriod(){
  const main=$("cpMain"), sub=$("cpSub"), time=$("cpTime");
  if(!main || !sub || !time) return;
  const now=new Date(), day=now.getDay();
  const seconds=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  const minute=Math.floor(seconds/60);
  const fmtClock=m=>fmtTime(m);
  let title="", detail="", range="", nextEvent=null;
  if(day===0 || day===6){
    title="오늘은 수업일이 아니에요"; detail="월요일부터 금요일까지의 수업 시간 기준이에요";
  }else if(seconds<8*3600+20*60){
    title="수업 시작 전"; detail=`1교시 시작까지 ${formatLeft((8*3600+20*60)-seconds)} 남았어요`; range="시작 08:20";
    nextEvent=8*60+20;
  }else if(seconds>=16*3600){
    title="오늘 수업이 끝났어요"; detail="오늘도 수고했어요!";
  }else if(seconds>=12*3600+20*60 && seconds<13*3600+10*60){
    title="점심시간"; detail=`점심시간 종료까지 ${formatLeft((13*3600+10*60)-seconds)} 남았어요`; range="12:20 ~ 13:10";
    nextEvent=13*60+10;
  }else{
    let found=false;
    for(let i=0;i<PERIODS.length;i++){
      const p=PERIODS[i], start=p.start*60, end=p.end*60;
      if(seconds>=start && seconds<end){
        title=p.name+" 수업 중";
        detail=`수업 종료까지 ${formatLeft(end-seconds)} 남았어요`;
        range=`${fmtClock(p.start)} ~ ${fmtClock(p.end)}`;
        nextEvent=p.end;found=true;break;
      }
      const next=PERIODS[i+1];
      if(i===3 && seconds>=p.end*60 && seconds<12*3600+20*60){
        title="쉬는 시간";
        detail=`점심시간 시작까지 ${formatLeft((12*3600+20*60)-seconds)} 남았어요`;
        range="12:10 ~ 12:20";nextEvent=12*60+20;found=true;break;
      }
      if(seconds>=end && next && seconds<next.start*60){
        title="쉬는 시간";
        detail=`${next.name} 시작까지 ${formatLeft(next.start*60-seconds)} 남았어요`;
        range=`${fmtClock(p.end)} ~ ${fmtClock(next.start)}`;
        nextEvent=next.start;found=true;break;
      }
    }
    if(!found && !title){title="수업 시간 외";detail="다음 수업 시간을 확인해 주세요";}
  }
  main.textContent=title; sub.textContent=detail; time.textContent=range;
  // 초가 0인 정확한 경계에서만 알림. 같은 분의 반복 알림은 방지.
  const key=`${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${now.getHours()}-${now.getMinutes()}`;
  if(alarmsEnabled && now.getSeconds()<=2 && key!==lastAlarmKey && day>=1 && day<=5){
    const messages=eventsAt(minute);
    if(messages.length){lastAlarmKey=key;showAlarm(messages.join(" / "));}
  }
}
renderDailySchedule();
updateCurrentPeriod();
setInterval(updateCurrentPeriod,1000);

function render(rows){
  if(!rows.length){$("out").innerHTML='<div id="msg">이 주에는 시간표가 없어요.<br>방학이거나 아직 등록되지 않았을 수 있어요.</div>';return}
  const map={}; let maxP=0;
  rows.forEach(r=>{const p=+r.PERIO;if(p>7)return;maxP=Math.max(maxP,p);(map[r.ALL_TI_YMD+"_"+p]=r.ITRT_CNTNT)});
  const todayStr=ymd(new Date());
  const dates=DAYS.map((_,i)=>addDays(monday,i));
  let h='<table><thead><tr><th class="n"></th>'+dates.map((d,i)=>`<th class="${ymd(d)===todayStr?"t":""}">${DAYS[i]}<span>${d.getDate()}</span></th>`).join("")+'</tr></thead><tbody>';
  for(let p=1;p<=maxP;p++){
    h+=`<tr><td class="n">${p}</td>`;
    dates.forEach(dt=>{
      const d=ymd(dt), s=map[d+"_"+p], name=s?s.replace(/^\*/,""):"";
      h+=`<td class="${d===todayStr?"t":""}">`+(name?`<span class="s" style="--h:${hue(name)}">${esc(name)}</span>`:'<span class="e"></span>')+"</td>";
    });
    h+="</tr>";
  }
  $("out").innerHTML=h+"</tbody></table>";
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
</script>
